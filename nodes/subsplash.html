<script type="text/javascript">
window.SUBSPLASH_EDITOR_CATALOG = window.SUBSPLASH_EDITOR_CATALOG || {};

window.subsplashJsonOrEmpty = function (v) {
    if (v === undefined || v === null || String(v).trim() === "") {
        return true;
    }
    try {
        JSON.parse(v);
        return true;
    } catch (err) {
        return false;
    }
};

window.subsplashBaseUrl = function (v) {
    if (!v) {
        return false;
    }
    try {
        var url = new URL(v);
        if (url.protocol !== "https:" && url.protocol !== "http:") {
            return false;
        }
        if (url.username || url.password) {
            return false;
        }
        return true;
    } catch (err) {
        return false;
    }
};

window.subsplashLabel = function (node) {
    if (node.name) {
        return node.name;
    }
    var ops = (window.SUBSPLASH_EDITOR_CATALOG && window.SUBSPLASH_EDITOR_CATALOG[node.type]) || [];
    for (var i = 0; i < ops.length; i++) {
        if (ops[i].operationId === node.operation) {
            return ops[i].label;
        }
    }
    return (node.type || "subsplash").replace("subsplash-", "");
};

window.subsplashPrepare = function (node) {
    var ops = (window.SUBSPLASH_EDITOR_CATALOG && window.SUBSPLASH_EDITOR_CATALOG[node.type]) || [];
    var select = $("#node-input-operation");
    var filter = $("#subsplash-op-filter");
    function fill(term) {
        var current = select.val() || node.operation;
        var needle = (term || "").toLowerCase();
        select.empty();
        ops.forEach(function (op) {
            var hay = (op.label + " " + op.method + " " + op.path + " " + op.operationId).toLowerCase();
            if (needle && hay.indexOf(needle) === -1 && op.operationId !== current) {
                return;
            }
            var text = op.label + "  —  " + op.method + " " + op.path;
            $("<option>").val(op.operationId).text(text).appendTo(select);
        });
        if (current) {
            select.val(current);
        }
    }
    function show(selector, on) {
        $(selector).toggle(!!on);
    }
    function describe() {
        var id = select.val();
        var op = null;
        for (var i = 0; i < ops.length; i++) {
            if (ops[i].operationId === id) {
                op = ops[i];
            }
        }
        var ui = op && op.ui ? op.ui : null;
        if (!ui) {
            show(".subsplash-id", op && op.pathParams && op.pathParams.length);
            show(".subsplash-path-params", false);
            show(".subsplash-body", op && op.body);
            show(".subsplash-filters", true);
            show(".subsplash-include", true);
            show(".subsplash-sort", true);
            show(".subsplash-fields", true);
            show(".subsplash-page", op && op.collection);
            show(".subsplash-total", true);
            show(".subsplash-accept", true);
            show(".subsplash-defaults", true);
        } else {
            show(".subsplash-id", ui.resourceId);
            show(".subsplash-path-params", ui.extraPathParams && ui.extraPathParams.length);
            show(".subsplash-body", ui.body);
            show(".subsplash-filters", ui.filters);
            show(".subsplash-include", ui.include);
            show(".subsplash-sort", ui.sort);
            show(".subsplash-fields", ui.fields);
            show(".subsplash-page", ui.paging);
            show(".subsplash-total", ui.total);
            show(".subsplash-accept", ui.accept);
            show(".subsplash-defaults", ui.defaultKeys);
        }
        if (!op) {
            $("#subsplash-op-summary").text("");
            return;
        }
        var bits = [op.method + " " + op.path];
        if (op.summary) {
            bits.push(op.summary);
        }
        if (op.contentType) {
            bits.push("Body is " + op.contentType + (op.bodyRequired ? " (required)" : ""));
        }
        if (op.requiredQuery && op.requiredQuery.length) {
            bits.push("Requires " + op.requiredQuery.join(", "));
        }
        if (ui && ui.extraPathParams && ui.extraPathParams.length) {
            bits.push("Additional path parameters: " + ui.extraPathParams.join(", "));
        }
        if (ui && op.collection && !ui.paging) {
            bits.push("OpenAPI does not declare page parameters. Pass them with msg.pageNumber, msg.pageSize, msg.pagination, or msg.query. Fetch all follows _links.next when the API sends it.");
        } else if (op.pageUndocumented) {
            bits.push("OpenAPI does not declare page parameters for this list. Leave page fields blank to omit them. Fetch all follows _links.next when the API sends it.");
        }
        $("#subsplash-op-summary").text(bits.join(". ") + ".");
    }
    filter.on("keyup input", function () {
        fill(filter.val());
        describe();
    });
    select.on("change", describe);
    fill("");
    describe();
};

</script>

            },
            appKey: { value: "" },

            timeoutMs: { value: 30000, validate: RED.validators.number() },
            maxRetries: { value: 4, validate: RED.validators.number() },
            retryBaseMs: { value: 500, validate: RED.validators.number() },
            maxPages: { value: 50, validate: RED.validators.number() }

        credentials: {
            clientId: { type: "text" },
            clientSecret: { type: "password" },
            accessToken: { type: "password" },
            addClaims: { type: "text" }
        },
        label: function () {
            return this.name || "subsplash account";
        },
        icon: "subsplash.svg",
        color: "#F3D6C3"
    });

<script type="text/html" data-help-name="subsplash-config">
    <p>Stores the Subsplash API client credentials and fetches bearer tokens for the other Subsplash nodes.</p>
    <h3>Details</h3>
    <p>Subsplash authenticates resource calls with an RS256 bearer token. This node requests one with the client-credentials grant: <code>POST /tokens/v1/token</code> as <code>application/x-www-form-urlencoded</code> with <code>grant_type</code>, <code>client_id</code>, and <code>client_secret</code>. The token is cached in memory and refreshed <code>expires_in</code> seconds after it was issued, minus the refresh skew (30 seconds by default). A 401 on a later call clears the cache, requests a new token once, and retries the call.</p>
    <p>Client id, client secret, optional access token, and optional add-claims JSON are stored as Node-RED credentials. They are not written into the flow. An access token, when set, is sent as-is until Subsplash rejects it. If a client id and secret are also set, a 401 then falls back to the client-credentials grant.</p>
    <p>App key and org key are not secrets. Resource nodes can copy them into <code>filter[app_key]</code> and <code>filter[org_key]</code> when the operation documents that filter and the message did not set one.</p>
    <p>The published OpenAPI spec does not give a numeric request quota. When Subsplash responds with HTTP 429 (<code>too_many_requests</code>), the node waits for the <code>Retry-After</code> header, capped at 120 seconds, then retries. Without that header it waits using exponential backoff from the retry base. GET, HEAD, OPTIONS, and DELETE are also retried on HTTP 502, 503, and 504. POST and PATCH are not retried on those statuses, so a create is not sent twice.</p>
    <p>API credentials come from your Subsplash representative. The developer-site access form does not issue a client id or secret. Public signing-key reads do not use the bearer token.</p>
    <h3>References</h3>
    <ul>
        <li><a href="https://developer.subsplash.com/api/openapi.yaml">Subsplash OpenAPI specification</a></li>
        <li><a href="https://developer.subsplash.com/">Subsplash developer site</a></li>
    </ul>
</script>

<script type="text/html" data-help-name="subsplash-builder">
<p>Reads and writes Builder lists and the rows inside those lists.</p>

<h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">operation <span class="property-type">string</span></dt>
        <dd>Overrides the operation selected in the editor. Use the operation id shown below, for example <code>GetAllMediaItems</code>.</dd>
        <dt class="optional">resourceId <span class="property-type">string</span></dt>
        <dd>Resource id for operations whose path contains <code>{id}</code>. Replaces the resource ID typed in the editor. Still sent when the message sets it, even if that operation hides the field.</dd>
        <dt class="optional">body <span class="property-type">object | string</span></dt>
        <dd>Request body. When this is omitted, <code>msg.payload</code> is sent for operations that take a body.</dd>
        <dt class="optional">payload <span class="property-type">object | string</span></dt>
        <dd>Used as the request body only when <code>msg.body</code> is not set and the editor body is empty.</dd>
        <dt class="optional">filters <span class="property-type">object</span></dt>
        <dd>Merged over the editor filters. A key <code>status</code> is sent as <code>filter[status]</code>. Prefix a value with <code>!</code>, <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, or <code>&gt;=</code> for a comparison. Commas mean any of those values. Use <code>*</code> as a wildcard where the field allows it.</dd>
        <dt class="optional">query <span class="property-type">object</span></dt>
        <dd>Extra query parameters, using the API's parameter names. Merged over the editor query. Keys set here win over the same key in filters when the names match exactly.</dd>
        <dt class="optional">include <span class="property-type">string | array</span></dt>
        <dd>Related resources to embed, comma-separated or as an array. Replaces the editor include.</dd>
        <dt class="optional">sort <span class="property-type">string</span></dt>
        <dd>Sort list such as <code>-created_at,title</code>. Prefix a field with <code>-</code> for descending.</dd>
        <dt class="optional">fields <span class="property-type">object</span></dt>
        <dd>Sparse fieldsets. <code>{"responses":"count"}</code> is sent as <code>fields[responses]=count</code>.</dd>
        <dt class="optional">headers <span class="property-type">object</span></dt>
        <dd>Extra request headers. Authorization is set by the config node and is not taken from here.</dd>
        <dt class="optional">pageNumber <span class="property-type">number</span></dt>
        <dd>1-based page. Sent as <code>page[number]</code>.</dd>
        <dt class="optional">pageSize <span class="property-type">number</span></dt>
        <dd>Page size. Sent as <code>page[size]</code>. The platform maximum is usually 100.</dd>
        <dt class="optional">pagination <span class="property-type">string</span></dt>
        <dd><code>page</code> returns one page. <code>all</code> follows <code>_links.next</code> and, when page numbers apply, requests further pages. The config node's max pages caps the walk.</dd>
        <dt class="optional">maxPages <span class="property-type">number</span></dt>
        <dd>Overrides the config node's page cap for this message. Cannot exceed 500.</dd>
        <dt class="optional">collectionTotal <span class="property-type">string</span></dt>
        <dd><code>include</code> or <code>omit</code>. Sent as the <code>Collection-Total</code> header when set.</dd>
        <dt class="optional">collectionStats <span class="property-type">string</span></dt>
        <dd>Sent as the <code>Collection-Stats</code> header when set. Used by donation lists.</dd>
        <dt class="optional">accept <span class="property-type">string</span></dt>
        <dd>Overrides the Accept header. Some donation, payment, and form lists can return <code>text/csv</code>.</dd>
        <dt class="optional">output <span class="property-type">string</span></dt>
        <dd><code>response</code> keeps the API body. <code>items</code> replaces <code>msg.payload</code> with the single embedded array when there is one.</dd>
        <dt class="optional">pathParams <span class="property-type">object</span></dt>
        <dd>Named path parameters. <code>resourceId</code> fills <code>id</code> when that is the only placeholder.</dd>
    </dl>
<h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object | array | string</span></dt>
        <dd>The response body, or the embedded items when output is <code>items</code>. On an API error this is the error body.</dd>
        <dt>statusCode <span class="property-type">number</span></dt>
        <dd>HTTP status of the last response.</dd>
        <dt>headers <span class="property-type">object</span></dt>
        <dd>Response headers. Names are lower case, as Node reports them.</dd>
        <dt>subsplash <span class="property-type">object</span></dt>
        <dd>Call metadata: <code>operation</code>, <code>method</code>, <code>path</code>, <code>url</code>, <code>pagesFetched</code>, <code>count</code>, <code>total</code>, <code>truncated</code>, and <code>collection</code>. Failures also set <code>subsplash.error</code> with <code>message</code>, <code>statusCode</code>, and <code>code</code>.</dd>
    </dl>

<h3>Details</h3>
    <p>Choose an operation in the node, or set <code>msg.operation</code> to one of the ids below. The editor shows Resource ID, Body, Filters, Include, Sort, Fields, paging, Total, and Accept only when the selected operation declares them. Query, Headers, and Output stay available on every operation. A value saved in a hidden field is not sent. A property on the message is still sent, and it replaces the same editor field. Filters, query, and headers are merged, and the message value wins for a key that appears in both.</p>
    <p>List calls can return one page or walk every page. Fetch-all follows the HAL <code>_links.next</code> link when Subsplash sends one. When the operation uses page numbers and there is no next link, further pages are requested until the page is short, <code>total</code> is reached, a page repeats, or the page cap is hit. A merged collection reports <code>count</code> as the number of combined resources. <code>subsplash.truncated</code> is true when the cap stopped the walk early.</p>
    <p>Set <code>output</code> to <code>items</code> when the next node wants the embedded array instead of the collection envelope. Other message properties are left in place.</p>
    <p>API failures call <code>done(err)</code>. Node-RED then reports the error with the message attached, so a Catch node receives <code>msg.statusCode</code>, the error body on <code>msg.payload</code>, and <code>msg.subsplash.error.code</code> (for example <code>resource_not_found</code> or <code>too_many_requests</code>).</p>
    <p>When "Apply default app and org keys" is checked, a documented <code>filter[app_key]</code> or <code>filter[org_key]</code> is filled from the config node if the message did not set it. Filters the operation does not document are not added.</p>
<h4>Operations</h4>
<h4>ListListRows</h4>
<p><code>GET /builder/v1/list-rows</code>. List ListRows. Requires a bearer token. Collection. OpenAPI does not declare page parameters, so the paging fields are hidden. <code>msg.pagination</code>, <code>msg.pageNumber</code>, <code>msg.pageSize</code>, and <code>msg.query</code> still work, and fetch-all follows <code>_links.next</code>.</p>
<p>To retrieve list rows for a saved &#x27;standard&#x27; or &#x27;dynamic&#x27; list, filter[source_list] can be used. To preview list rows for a dynamic list, filter[app_key] and filter[type] can be used along with additional filters.</p>
<h4>CreateListRow</h4>
<p><code>POST /builder/v1/list-rows</code>. Create a ListRow. Requires a bearer token. Optional body (<code>application/json</code>).</p>
<p>Creates a new ListRow for a &#x27;standard&#x27; list only</p>
<p>Required body fields: <code>type</code>.</p>
<h4>GetOneListRow</h4>
<p><code>GET /builder/v1/list-rows/{id}</code>. Get One ListRow. Requires a bearer token.</p>
<h4>UpdateListRow</h4>
<p><code>PATCH /builder/v1/list-rows/{id}</code>. Update a ListRow. Requires a bearer token. Optional body (<code>application/json</code>).</p>
<p>Updates a ListRow for a &#x27;standard&#x27; list only</p>
<p>Required body fields: <code>type</code>.</p>
<h4>DeleteListRow</h4>
<p><code>DELETE /builder/v1/list-rows/{id}</code>. Delete a ListRow. Requires a bearer token.</p>
<p>Deletes a ListRow for a &#x27;standard&#x27; list only</p>
<h4>ListLists</h4>
<p><code>GET /builder/v1/lists</code>. List Lists. Requires a bearer token. Collection. OpenAPI does not declare page parameters, so the paging fields are hidden. <code>msg.pagination</code>, <code>msg.pageNumber</code>, <code>msg.pageSize</code>, and <code>msg.query</code> still work, and fetch-all follows <code>_links.next</code>.</p>
<h4>CreateList</h4>
<p><code>POST /builder/v1/lists</code>. Create a List. Requires a bearer token. Optional body (<code>application/json</code>).</p>
<p>Creates a new List</p>
<p>Required body fields: <code>type</code>.</p>
<h4>GetOneList</h4>
<p><code>GET /builder/v1/lists/{id}</code>. Get One List. Requires a bearer token.</p>
<h4>UpdateList</h4>
<p><code>PATCH /builder/v1/lists/{id}</code>. Update a List. Requires a bearer token. Optional body (<code>application/json</code>).</p>
<p>Note that this API is a little different than most in that it supports updates/creates for embedded list row resources. It&#x27;s important to note that the logic enforces list row positional ordering such that if a new list row is inserted or moved, that it may result in updates to other list row resources belonging to...</p>
<p>Required body fields: <code>app_key</code>, <code>id</code>.</p>
<h4>DeleteList</h4>
<p><code>DELETE /builder/v1/lists/{id}</code>. Delete a List. Requires a bearer token.</p>
<h3>References</h3>
    <ul>
        <li><a href="https://developer.subsplash.com/api/openapi.yaml">Subsplash OpenAPI specification</a> — source for these operations</li>
        <li><a href="https://developer.subsplash.com/">Subsplash developer site</a> — documentation access is separate from API credentials</li>
    </ul>
</script>

<script type="text/html" data-help-name="subsplash-donations">
<p>Reads giving data and manages funds: campaigns, donations, pledges, recurring donations, and terminals.</p>

<h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">operation <span class="property-type">string</span></dt>
        <dd>Overrides the operation selected in the editor. Use the operation id shown below, for example <code>GetAllMediaItems</code>.</dd>
        <dt class="optional">resourceId <span class="property-type">string</span></dt>
        <dd>Resource id for operations whose path contains <code>{id}</code>. Replaces the resource ID typed in the editor. Still sent when the message sets it, even if that operation hides the field.</dd>
        <dt class="optional">body <span class="property-type">object | string</span></dt>
        <dd>Request body. When this is omitted, <code>msg.payload</code> is sent for operations that take a body.</dd>
        <dt class="optional">payload <span class="property-type">object | string</span></dt>
        <dd>Used as the request body only when <code>msg.body</code> is not set and the editor body is empty.</dd>
        <dt class="optional">filters <span class="property-type">object</span></dt>
        <dd>Merged over the editor filters. A key <code>status</code> is sent as <code>filter[status]</code>. Prefix a value with <code>!</code>, <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, or <code>&gt;=</code> for a comparison. Commas mean any of those values. Use <code>*</code> as a wildcard where the field allows it.</dd>
        <dt class="optional">query <span class="property-type">object</span></dt>
        <dd>Extra query parameters, using the API's parameter names. Merged over the editor query. Keys set here win over the same key in filters when the names match exactly.</dd>
        <dt class="optional">include <span class="property-type">string | array</span></dt>
        <dd>Related resources to embed, comma-separated or as an array. Replaces the editor include.</dd>
        <dt class="optional">sort <span class="property-type">string</span></dt>
        <dd>Sort list such as <code>-created_at,title</code>. Prefix a field with <code>-</code> for descending.</dd>
        <dt class="optional">fields <span class="property-type">object</span></dt>
        <dd>Sparse fieldsets. <code>{"responses":"count"}</code> is sent as <code>fields[responses]=count</code>.</dd>
        <dt class="optional">headers <span class="property-type">object</span></dt>
        <dd>Extra request headers. Authorization is set by the config node and is not taken from here.</dd>
        <dt class="optional">pageNumber <span class="property-type">number</span></dt>
        <dd>1-based page. Sent as <code>page[number]</code>.</dd>
        <dt class="optional">pageSize <span class="property-type">number</span></dt>
        <dd>Page size. Sent as <code>page[size]</code>. The platform maximum is usually 100.</dd>
        <dt class="optional">pagination <span class="property-type">string</span></dt>
        <dd><code>page</code> returns one page. <code>all</code> follows <code>_links.next</code> and, when page numbers apply, requests further pages. The config node's max pages caps the walk.</dd>
        <dt class="optional">maxPages <span class="property-type">number</span></dt>
        <dd>Overrides the config node's page cap for this message. Cannot exceed 500.</dd>
        <dt class="optional">collectionTotal <span class="property-type">string</span></dt>
        <dd><code>include</code> or <code>omit</code>. Sent as the <code>Collection-Total</code> header when set.</dd>
        <dt class="optional">collectionStats <span class="property-type">string</span></dt>
        <dd>Sent as the <code>Collection-Stats</code> header when set. Used by donation lists.</dd>
        <dt class="optional">accept <span class="property-type">string</span></dt>
        <dd>Overrides the Accept header. Some donation, payment, and form lists can return <code>text/csv</code>.</dd>
        <dt class="optional">output <span class="property-type">string</span></dt>
        <dd><code>response</code> keeps the API body. <code>items</code> replaces <code>msg.payload</code> with the single embedded array when there is one.</dd>
        <dt class="optional">pathParams <span class="property-type">object</span></dt>
        <dd>Named path parameters. <code>resourceId</code> fills <code>id</code> when that is the only placeholder.</dd>
    </dl>
<h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object | array | string</span></dt>
        <dd>The response body, or the embedded items when output is <code>items</code>. On an API error this is the error body.</dd>
        <dt>statusCode <span class="property-type">number</span></dt>
        <dd>HTTP status of the last response.</dd>
        <dt>headers <span class="property-type">object</span></dt>
        <dd>Response headers. Names are lower case, as Node reports them.</dd>
        <dt>subsplash <span class="property-type">object</span></dt>
        <dd>Call metadata: <code>operation</code>, <code>method</code>, <code>path</code>, <code>url</code>, <code>pagesFetched</code>, <code>count</code>, <code>total</code>, <code>truncated</code>, and <code>collection</code>. Failures also set <code>subsplash.error</code> with <code>message</code>, <code>statusCode</code>, and <code>code</code>.</dd>
    </dl>

<h3>Details</h3>
    <p>Choose an operation in the node, or set <code>msg.operation</code> to one of the ids below. The editor shows Resource ID, Body, Filters, Include, Sort, Fields, paging, Total, and Accept only when the selected operation declares them. Query, Headers, and Output stay available on every operation. A value saved in a hidden field is not sent. A property on the message is still sent, and it replaces the same editor field. Filters, query, and headers are merged, and the message value wins for a key that appears in both.</p>
    <p>List calls can return one page or walk every page. Fetch-all follows the HAL <code>_links.next</code> link when Subsplash sends one. When the operation uses page numbers and there is no next link, further pages are requested until the page is short, <code>total</code> is reached, a page repeats, or the page cap is hit. A merged collection reports <code>count</code> as the number of combined resources. <code>subsplash.truncated</code> is true when the cap stopped the walk early.</p>
    <p>Set <code>output</code> to <code>items</code> when the next node wants the embedded array instead of the collection envelope. Other message properties are left in place.</p>
    <p>API failures call <code>done(err)</code>. Node-RED then reports the error with the message attached, so a Catch node receives <code>msg.statusCode</code>, the error body on <code>msg.payload</code>, and <code>msg.subsplash.error.code</code> (for example <code>resource_not_found</code> or <code>too_many_requests</code>).</p>
    <p>When "Apply default app and org keys" is checked, a documented <code>filter[app_key]</code> or <code>filter[org_key]</code> is filled from the config node if the message did not set it. Filters the operation does not document are not added.</p>
<h4>Operations</h4>
<h4>GetAllCampaigns</h4>
<p><code>GET /donations/v1/campaigns</code>. List Campaigns. Requires a bearer token. Paginated collection.</p>
<p>Retrieves a list of campaigns based on the provided filters and pagination parameters.</p>
<ul><li><code>filter[org_key]</code> (required) — eight character org code.</li><li><code>filter[title]</code> — Filter by campaign title.</li><li><code>filter[campaign.id]</code> — The ID of a desired campaign</li><li><code>filter[start_date.min]</code> — Earliest campaign start date to filter campaigns by where start_date is a valid RFC3339 date. Supports the `=` operator. e.g. `?filter[start_date.min]=1996-12-19T16:39:57-08:00`...</li><li><code>filter[start_date.max]</code> — Latest campaign start date to filter campaigns by where start_date is a valid RFC3339 date. Supports the `=` operator. e.g. `?filter[start_date.max]=1996-12-19T16:39:57-08:00` w...</li><li><code>filter[end_date.min]</code> — Earliest campaign end date to filter campaigns by where end_date is a valid RFC3339 date. Supports the `=` operator. e.g. `?filter[end_date.min]=1996-12-19T16:39:57-08:00` will...</li><li><code>filter[end_date.max]</code> — Latest campaign end date to filter campaigns by where end_date is a valid RFC3339 date. Supports the `=` operator. e.g. `?filter[end_date.max]=1996-12-19T16:39:57-08:00` will ca...</li><li><code>filter[state]</code> (draft, scheduled, active, done)</li><li><code>sort</code> — Fields to sort on.</li><li><code>include</code> — The resources to include on the campaign.</li></ul>
<p>Headers:</p><ul><li><code>Collection-Total</code> (include, omit)</li></ul>
<h4>GetOneCampaign</h4>
<p><code>GET /donations/v1/campaigns/{id}</code>. Get one Campaign. Requires a bearer token.</p>
<p>Retrieves detailed information about a specific campaign by its ID.</p>
<ul><li><code>include</code> — The resources to include on the campaign.</li></ul>
<h4>GetOneCampaignContributions</h4>
<p><code>GET /donations/v1/campaigns/{id}/contributions</code>. Get one Campaign&#x27;s Contributions. Requires a bearer token.</p>
<p>Retrieves a list of contributions for a specific campaign.</p>
<ul><li><code>filter[org_key]</code> (required) — Eight character org code.</li><li><code>filter[end-user.id]</code> — ID of the end-user to filter embedded contributions by.</li><li><code>filter[search]</code> — Search term to filter pledges by first and last name of the donor. Supports the `=` operator.</li></ul>
<p>Headers:</p><ul><li><code>Accept</code> (text/csv, application/hal+json)</li></ul>
<h4>GetAllDonations</h4>
<p><code>GET /donations/v1/donations</code>. List Donations. Requires a bearer token. Paginated collection.</p>
<p>Retrieves a list of donations based on the provided filters and pagination parameters.</p>
<ul><li><code>filter[id]</code> — ID of the donations to filter by.</li><li><code>filter[org_key]</code> — Eight character org code. Supports one or a list of org keys.</li><li><code>filter[batch.id]</code> — ID of the batch to filter donations by. When this filter is present, all donations will be returned including ones marked &quot;hidden&quot; from the UI with the `b` flag.</li><li><code>filter[end-user.id]</code> — ID of the end-user to filter donations by. Supports one or a list of UUIDs.</li><li><code>filter[fund.id]</code> — ID of the fund or subfund to filter donations by. Supports a single UUID or a collection of uuids. `=` and `!=` operations are the only operators supported. e.g. `?filter[fund.i...</li><li><code>filter[hidden]</code> — An alternative way to include donations marked &quot;hidden&quot;. This is useful for getting the whole set of donations for an end-user without having to know batch ids. If you want hidd...</li><li><code>filter[status]</code> (refunded, transfer pending, transfer_pending, paid, batched, failed, disputed, pending, deleted)</li><li><code>filter[refunded]</code> — Include or exclude refunded donations. Since a gift can be paid, and then refunded, including just a paid status filter may also include refunded gifts.</li><li><code>filter[auth_date]</code> — Filter donations by the date/time they were recorded where auth_date is a valid: - RFC3339 date/time (e.g. `2006-01-02T15:04:05-07:00`) - MySQL-style date/time (e.g. `2006-01-02...</li><li><code>filter[auth_date.min]</code> — Earliest auth date to filter records by where auth_date is a valid: - RFC3339 date/time (2006-01-02T15:04:05Z07:00) - MySQL-style date/time (2006-01-02 15:04:05) - date only str...</li><li><code>filter[auth_date.max]</code> — Latest auth date to filter records by where auth_date is a valid: - RFC3339 date/time (2006-01-02T15:04:05Z07:00) - MySQL-style date/time (2006-01-02 15:04:05) - date only strin...</li><li><code>filter[updated_at]</code> — Filter by the resource&#x27;s updated_at value.</li><li><code>filter[updated_at.min]</code> — Earliest updated_at to filter donations by where updated_at is a valid RFC3339 date. Supports the `=` operator. e.g. `?filter[updated_at.min]=1996-12-19T16:39:57-08:00` will ret...</li><li><code>filter[updated_at.max]</code> — Latest updated_at to filter donations by where updated_at is a valid RFC3339 date. Supports the `=` operator. e.g. `?filter[updated_at.max]=1996-12-19T16:39:57-08:00` will retur...</li><li><code>filter[campus.id]</code> — Campus UUID to filter by. Supports a single UUID or a collection of uuids. `=` and `!=` operations are the only operators supported. e.g. `?filter[campus.id]=:id1,:id2` will ret...</li><li><code>filter[amount]</code> — Amount to filter donations by. Supports a single int value in pennies. Supports `=`, `&gt;`,`&lt;`, and `!=` operators. e.g. `?filter[amount]=&gt;100` will return Donations with amounts...</li><li><code>filter[amount.min]</code> — Minimum amount to filter donations by. Supports a single int value in pennies. Supports `=` operator. e.g. `?filter[amount.min]=100` will return Donations with amounts greater t...</li><li><code>filter[amount.max]</code> — Maximum amount to filter donations by. Supports a single int value in pennies. Supports `=` operator. e.g. `?filter[amount.max]=200` will return Donations with amounts less than...</li><li><code>filter[recurring.id]</code> — Filter donations by their associated recurring id</li><li><code>filter[transfer.id]</code> — Filter donations by their associated transfer ID. Supports a single UUID or a collection of UUIDs using the `=` and `!=` operators. Also supports `=null` and `=!null` to filter...</li><li><code>filter[payout.id]</code> — Filter donations by their associated payout ID. Supports a single UUID or a collection of UUIDs.</li><li><code>filter[instrument.type]</code> — Instrument type to filter donations by. Supports a single type, or a collection of types, using the following operators: `=`, `=!`. e.g. `?filter[instrument.type]=Visa,MasterCar...</li><li><code>filter[frequency]</code> — Frequency to filter donations by. Supports the `=` operator with a single value.</li><li><code>filter[search]</code> — Search term to filter donations by. Supports the `=` operator. Will search funds, causes, campuses, batches, and everything in the people search API. See https://api.docs.subspl...</li><li><code>sort</code> — Fields to sort a list of Donations on.</li><li><code>include</code> — The resources to include on the donation. - `refunds.payout` adds a `payout` reference (id and short_id) to each embedded refund. Has no effect unless `refunds` is also included.</li></ul>
<p>Headers:</p><ul><li><code>Collection-Total</code> (include)</li><li><code>Collection-Stats</code> (include)</li><li><code>Accept</code> (application/hal+json, text/csv)</li></ul>
<h4>GetOneDonation</h4>
<p><code>GET /donations/v1/donations/{id}</code>. Get a Donation. Requires a bearer token.</p>
<p>Retrieves detailed information about a specific donation by its ID.</p>
<ul><li><code>include</code> — The resources to include on the donation. - `refunds.payout` adds a `payout` reference (id and short_id) to each embedded refund. Has no effect unless `refunds` is also included.</li></ul>
<h4>GetAllFunds</h4>
<p><code>GET /donations/v1/funds</code>. List Funds. Requires a bearer token. Paginated collection.</p>
<p>Retrieves a list of funds based on the provided filters and pagination parameters.</p>
<ul><li><code>filter[name]</code> — Filter by fund name.</li><li><code>filter[org_key]</code> (required) — Eight character org code</li></ul>
<h4>CreateFund</h4>
<p><code>POST /donations/v1/funds</code>. Create a Fund. Requires a bearer token. Optional body (<code>application/json</code>).</p>
<p>Creates a new fund with the provided information.</p>
<p>Required body fields: <code>name</code>, <code>org_key</code>.</p>
<h4>GetOneFund</h4>
<p><code>GET /donations/v1/funds/{id}</code>. Get one Fund. Requires a bearer token.</p>
<p>Retrieves detailed information about a specific fund by its ID.</p>
<h4>UpdateOneFund</h4>
<p><code>PATCH /donations/v1/funds/{id}</code>. Update one Fund. Requires a bearer token. Optional body (<code>application/json</code>).</p>
<p>Updates an existing fund with the provided information.</p>
<p>Body fields include <code>state</code>.</p>
<h4>GetAllPledges</h4>
<p><code>GET /donations/v1/pledges</code>. List Pledges. Requires a bearer token. Paginated collection.</p>
<p>This endpoint returns a list of pledges based on the given filters and sorts.</p>
<ul><li><code>include</code> — The resources to include.</li><li><code>filter[org_key]</code> (required) — Eight character org code.</li><li><code>filter[end-user.id]</code></li><li><code>filter[campaign.id]</code></li><li><code>filter[created_at]</code> — Created at date to filter pledges by where created_at is a valid RFC3339 date. Supports `&gt;`, `&lt;`, `=`, and `!=` e.g. `?filter[created_at]=&gt;1996-12-19T16:39:57-08:00`</li><li><code>filter[updated_at]</code> — Updated at date for filtering pledges where updated_at is a valid RFC3339 date. Supports `&gt;`, `&lt;`, `=`, and `!=` e.g. `?filter[updated_at]=&gt;1996-12-19T16:39:57-08:00`</li></ul>
<h4>GetOnePledge</h4>
<p><code>GET /donations/v1/pledges/{id}</code>. Get one Pledge. Requires a bearer token.</p>
<p>Retrieves detailed information about a specific pledge by its ID.</p>
<ul><li><code>include</code> — The resources to include on a given pledge</li></ul>
<h4>GetAllRecurringDonations</h4>
<p><code>GET /donations/v1/recurring-donations</code>. List RecurringDonations. Requires a bearer token. Paginated collection.</p>
<p>By default, this endpoint does not return `RecurringDonations` with the `canceled` status.</p>
<ul><li><code>filter[search]</code> — Search term to filter recurring donations by. Supports the `=` operator. Will search funds, causes, campuses, amounts, short IDs, and everything in the people search API. See ht...</li><li><code>filter[id]</code> — Filter by id.</li><li><code>filter[app_key]</code> — Six character app code</li><li><code>filter[org_key]</code> — Org key of the organization to which this recurring donation belongs. Supports one or a list of org keys.</li><li><code>filter[donor.id]</code> — ID for the donor (users table).</li><li><code>filter[end-user.id]</code> — ID for the end user. This filters recurring donations by the end user&#x27;s ID, querying both the legacy user ID and the current end-user ID fields. Supports one or a list of UUIDs.</li><li><code>filter[campus.id]</code> — ID for the associated campus if applicable.</li><li><code>filter[fund.id]</code> — ID for the fund (funds table) or potentially subfund (causes table).</li><li><code>filter[paysource.id]</code> — ID for the paysource (either card or user_bank_account uuid).</li><li><code>filter[parent.id]</code> — ID for the parent of any recurring donations (time trigger records), used primarily for semi monthly gifts.</li><li><code>filter[currency]</code> — Three character representation of valid currency (USD or CAD).</li><li><code>filter[next_process_at]</code> — Filter by date/time of next processing date.</li><li><code>filter[amount]</code> — Amount to filter by.</li><li><code>filter[donor_covered_fee]</code> — Filter by donor_covered_fee flag.</li><li><code>filter[status]</code> (active, paused, canceled, failed)</li><li><code>sort</code> — Fields to sort on.</li><li><code>include</code> — The resources to include on the recurring donation.</li></ul>
<p>Headers:</p><ul><li><code>Accept</code> (application/hal+json, text/csv)</li></ul>
<h4>GetOneRecurringDonation</h4>
<p><code>GET /donations/v1/recurring-donations/{id}</code>. Get one RecurringDonation. Requires a bearer token.</p>
<p>Retrieves detailed information about a specific recurring donation by its ID.</p>
<ul><li><code>include</code> — The resources to include on the recurring donation.</li><li><code>filter[status]</code> (active, canceled, failed)</li></ul>
<h4>GetAllDonationTerminals</h4>
<p><code>GET /donations/v1/terminals</code>. List DonationTerminals. Requires a bearer token. Collection. OpenAPI does not declare page parameters, so the paging fields are hidden. <code>msg.pagination</code>, <code>msg.pageNumber</code>, <code>msg.pageSize</code>, and <code>msg.query</code> still work, and fetch-all follows <code>_links.next</code>.</p>
<p>Retrieves a list of donation terminals based on the provided filters and pagination parameters.</p>
<ul><li><code>filter[id]</code> — Filter by id.</li><li><code>filter[short_code]</code> — Six character short code (app_key). Must be included to return funds and campuses.</li><li><code>include</code> — Specify which embedded resources to include with each resource. Possible options are: - `unpublished-funds` - `unpublished-campuses`</li></ul>
<h3>References</h3>
    <ul>
        <li><a href="https://developer.subsplash.com/api/openapi.yaml">Subsplash OpenAPI specification</a> — source for these operations</li>

    </ul>

<script type="text/html" data-help-name="subsplash-events">
<p>Reads and writes calendars, events, and repeating events.</p>

<h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">operation <span class="property-type">string</span></dt>
        <dd>Overrides the operation selected in the editor. Use the operation id shown below, for example <code>GetAllMediaItems</code>.</dd>
        <dt class="optional">resourceId <span class="property-type">string</span></dt>
        <dd>Resource id for operations whose path contains <code>{id}</code>. Replaces the resource ID typed in the editor. Still sent when the message sets it, even if that operation hides the field.</dd>
        <dt class="optional">body <span class="property-type">object | string</span></dt>
        <dd>Request body. When this is omitted, <code>msg.payload</code> is sent for operations that take a body.</dd>
        <dt class="optional">payload <span class="property-type">object | string</span></dt>
        <dd>Used as the request body only when <code>msg.body</code> is not set and the editor body is empty.</dd>
        <dt class="optional">filters <span class="property-type">object</span></dt>
        <dd>Merged over the editor filters. A key <code>status</code> is sent as <code>filter[status]</code>. Prefix a value with <code>!</code>, <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, or <code>&gt;=</code> for a comparison. Commas mean any of those values. Use <code>*</code> as a wildcard where the field allows it.</dd>
        <dt class="optional">query <span class="property-type">object</span></dt>
        <dd>Extra query parameters, using the API's parameter names. Merged over the editor query. Keys set here win over the same key in filters when the names match exactly.</dd>
        <dt class="optional">include <span class="property-type">string | array</span></dt>
        <dd>Related resources to embed, comma-separated or as an array. Replaces the editor include.</dd>
        <dt class="optional">sort <span class="property-type">string</span></dt>
        <dd>Sort list such as <code>-created_at,title</code>. Prefix a field with <code>-</code> for descending.</dd>
        <dt class="optional">fields <span class="property-type">object</span></dt>
        <dd>Sparse fieldsets. <code>{"responses":"count"}</code> is sent as <code>fields[responses]=count</code>.</dd>
        <dt class="optional">headers <span class="property-type">object</span></dt>
        <dd>Extra request headers. Authorization is set by the config node and is not taken from here.</dd>
        <dt class="optional">pageNumber <span class="property-type">number</span></dt>
        <dd>1-based page. Sent as <code>page[number]</code>.</dd>
        <dt class="optional">pageSize <span class="property-type">number</span></dt>
        <dd>Page size. Sent as <code>page[size]</code>. The platform maximum is usually 100.</dd>
        <dt class="optional">pagination <span class="property-type">string</span></dt>
        <dd><code>page</code> returns one page. <code>all</code> follows <code>_links.next</code> and, when page numbers apply, requests further pages. The config node's max pages caps the walk.</dd>
        <dt class="optional">maxPages <span class="property-type">number</span></dt>
        <dd>Overrides the config node's page cap for this message. Cannot exceed 500.</dd>
        <dt class="optional">collectionTotal <span class="property-type">string</span></dt>
        <dd><code>include</code> or <code>omit</code>. Sent as the <code>Collection-Total</code> header when set.</dd>
        <dt class="optional">collectionStats <span class="property-type">string</span></dt>
        <dd>Sent as the <code>Collection-Stats</code> header when set. Used by donation lists.</dd>
        <dt class="optional">accept <span class="property-type">string</span></dt>
        <dd>Overrides the Accept header. Some donation, payment, and form lists can return <code>text/csv</code>.</dd>
        <dt class="optional">output <span class="property-type">string</span></dt>
        <dd><code>response</code> keeps the API body. <code>items</code> replaces <code>msg.payload</code> with the single embedded array when there is one.</dd>
        <dt class="optional">pathParams <span class="property-type">object</span></dt>
        <dd>Named path parameters. <code>resourceId</code> fills <code>id</code> when that is the only placeholder.</dd>
    </dl>
<h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object | array | string</span></dt>
        <dd>The response body, or the embedded items when output is <code>items</code>. On an API error this is the error body.</dd>
        <dt>statusCode <span class="property-type">number</span></dt>
        <dd>HTTP status of the last response.</dd>
        <dt>headers <span class="property-type">object</span></dt>
        <dd>Response headers. Names are lower case, as Node reports them.</dd>
        <dt>subsplash <span class="property-type">object</span></dt>
        <dd>Call metadata: <code>operation</code>, <code>method</code>, <code>path</code>, <code>url</code>, <code>pagesFetched</code>, <code>count</code>, <code>total</code>, <code>truncated</code>, and <code>collection</code>. Failures also set <code>subsplash.error</code> with <code>message</code>, <code>statusCode</code>, and <code>code</code>.</dd>
    </dl>

<h3>Details</h3>
    <p>Choose an operation in the node, or set <code>msg.operation</code> to one of the ids below. The editor shows Resource ID, Body, Filters, Include, Sort, Fields, paging, Total, and Accept only when the selected operation declares them. Query, Headers, and Output stay available on every operation. A value saved in a hidden field is not sent. A property on the message is still sent, and it replaces the same editor field. Filters, query, and headers are merged, and the message value wins for a key that appears in both.</p>
    <p>List calls can return one page or walk every page. Fetch-all follows the HAL <code>_links.next</code> link when Subsplash sends one. When the operation uses page numbers and there is no next link, further pages are requested until the page is short, <code>total</code> is reached, a page repeats, or the page cap is hit. A merged collection reports <code>count</code> as the number of combined resources. <code>subsplash.truncated</code> is true when the cap stopped the walk early.</p>
    <p>Set <code>output</code> to <code>items</code> when the next node wants the embedded array instead of the collection envelope. Other message properties are left in place.</p>
    <p>API failures call <code>done(err)</code>. Node-RED then reports the error with the message attached, so a Catch node receives <code>msg.statusCode</code>, the error body on <code>msg.payload</code>, and <code>msg.subsplash.error.code</code> (for example <code>resource_not_found</code> or <code>too_many_requests</code>).</p>
    <p>When "Apply default app and org keys" is checked, a documented <code>filter[app_key]</code> or <code>filter[org_key]</code> is filled from the config node if the message did not set it. Filters the operation does not document are not added.</p>
<h4>Operations</h4>
<h4>ListCalendarsV2</h4>
<p><code>GET /events/v2/calendars</code>. List Calendars. Requires a bearer token. Collection. OpenAPI does not declare page parameters, so the paging fields are hidden. <code>msg.pagination</code>, <code>msg.pageNumber</code>, <code>msg.pageSize</code>, and <code>msg.query</code> still work, and fetch-all follows <code>_links.next</code>.</p>
<p>Fetches Calendars according to search params</p>
<h4>CreateCalendar</h4>
<p><code>POST /events/v2/calendars</code>. Create a Calendar. Requires a bearer token. Optional body (<code>application/json</code>).</p>
<p>Adds a new Calendar</p>
<p>Required body fields: <code>app_key</code>, <code>color</code>, <code>title</code>.</p>
<h4>GetOneCalendar</h4>
<p><code>GET /events/v2/calendars/{id}</code>. Get one Calendar. Requires a bearer token.</p>
<p>Fetches an existing Event</p>
<h4>UpdateCalendar</h4>
<p><code>PATCH /events/v2/calendars/{id}</code>. Update a Calendar. Requires a bearer token. Optional body (<code>application/json</code>).</p>
<p>Updates an existing Calendar</p>
<p>Required body fields: <code>app_key</code>, <code>color</code>, <code>title</code>.</p>
<h4>DeleteCalendar</h4>
<p><code>DELETE /events/v2/calendars/{id}</code>. Delete a Calendar. Requires a bearer token.</p>
<p>Deletes an existing Calendar</p>
<h4>ListEventsV2</h4>
<p><code>GET /events/v2/events</code>. List Events. Requires a bearer token. Collection. OpenAPI does not declare page parameters, so the paging fields are hidden. <code>msg.pagination</code>, <code>msg.pageNumber</code>, <code>msg.pageSize</code>, and <code>msg.query</code> still work, and fetch-all follows <code>_links.next</code>.</p>
<p>Fetches Events according to search params</p>
<h4>CreateEvent</h4>
<p><code>POST /events/v2/events</code>. Create an Event. Requires a bearer token. Optional body (<code>application/json</code>).</p>
<p>Adds a new Event. If the new event is part of a calendar with images and the provided event does not include any images, the calendar&#x27;s images will be applied to the event. If RepeatingEvent embedded on Event, next instance in repeating series will be created. All fields will be populated by RepeatingEvent values an...</p>
<p>Required body fields: <code>app_key</code>, <code>id</code>, <code>timezone</code>, <code>title</code>.</p>
<h4>GetOneEvent</h4>
<p><code>GET /events/v2/events/{id}</code>. Get one Event. Requires a bearer token.</p>
<p>Fetches existing Event</p>
<h4>UpdateEvent</h4>
<p><code>PATCH /events/v2/events/{id}</code>. Update an Event. Requires a bearer token. Optional body (<code>application/json</code>).</p>
<p>Updates an existing Event</p>
<p>Required body fields: <code>app_key</code>, <code>id</code>, <code>timezone</code>, <code>title</code>.</p>
<h4>DeleteEvent</h4>
<p><code>DELETE /events/v2/events/{id}</code>. Delete an Event. Requires a bearer token.</p>
<p>Deletes an existing Event</p>
<h4>ListRepeatingEvents</h4>
<p><code>GET /events/v2/repeating-events</code>. List RepeatingEvents. Requires a bearer token. Collection. OpenAPI does not declare page parameters, so the paging fields are hidden. <code>msg.pagination</code>, <code>msg.pageNumber</code>, <code>msg.pageSize</code>, and <code>msg.query</code> still work, and fetch-all follows <code>_links.next</code>.</p>
<p>Fetches RepeatingEvents according to search params</p>
<h4>CreateRepeatingEvent</h4>
<p><code>POST /events/v2/repeating-events</code>. Create a RepeatingEvent. Requires a bearer token. Optional body (<code>application/json</code>).</p>
<p>Adds a new RepeatingEvent</p>
<h4>GetOneRepeatingEvent</h4>
<p><code>GET /events/v2/repeating-events/{id}</code>. Get one RepeatingEvent. Requires a bearer token.</p>
<p>Fetches existing RepeatingEvent</p>
<h4>UpdateRepeatingEvent</h4>
<p><code>PATCH /events/v2/repeating-events/{id}</code>. Update a RepeatingEvent. Requires a bearer token. Optional body (<code>application/json</code>).</p>
<p>Updates existing RepeatingEvent</p>
<h4>DeleteRepeatingEvent</h4>
<p><code>DELETE /events/v2/repeating-events/{id}</code>. Delete a RepeatingEvent. Requires a bearer token.</p>
<p>Deletes existing RepeatingEvent</p>

<h3>Inputs</h3>

<h4>Operations</h4>
<h4>ListGroupMembers</h4>
<p><code>GET /groups/v1/group-members</code>. List GroupMembers. Requires a bearer token. Collection. OpenAPI does not declare page parameters, so the paging fields are hidden. <code>msg.pagination</code>, <code>msg.pageNumber</code>, <code>msg.pageSize</code>, and <code>msg.query</code> still work, and fetch-all follows <code>_links.next</code>.</p>
<p>This endpoint lists GroupMembers belonging to a particular group(s). ### Cursor pagination Pass the request header `Pagination-Strategy: cursor` together with `sort=id` (or `sort=-id`) to opt into keyset pagination. The handler then emits a `_links.next` of the form ``` ?filter[group.id]=...&amp;filter[id]=&gt;last_seen_uu...</p>
<h4>CreateGroupMember</h4>
<p><code>POST /groups/v1/group-members</code>. Create a GroupMember. Requires a bearer token. Optional body (<code>application/json</code>).</p>
<p>Adds a new GroupMember. Note that first_name and last_name are automatically pulled from the profile associated with the end_user.</p>
<p>Body fields include <code>created_at</code>, <code>first_name</code>, <code>id</code>, <code>last_name</code>, <code>messaging_status</code>, <code>role</code>, <code>updated_at</code>.</p>
<h4>GetOneGroupMember</h4>
<p><code>GET /groups/v1/group-members/{id}</code>. Get one GroupMember. Requires a bearer token.</p>
<p>Gets the GroupMember associated with the provided id</p>
<h4>UpdateGroupMember</h4>
<p><code>PATCH /groups/v1/group-members/{id}</code>. Update a GroupMember. Requires a bearer token. Optional body (<code>application/json</code>).</p>
<p>Updates the GroupMember associated with the provide id.</p>
<p>Body fields include <code>created_at</code>, <code>first_name</code>, <code>id</code>, <code>last_name</code>, <code>messaging_status</code>, <code>role</code>, <code>updated_at</code>.</p>

<p>Deletes the GroupMember associated with the provided id.</p>

<p>This endpoint lists all default GroupTypes and also the ones attached to the app_key in the auth_token.</p>

<script type="text/html" data-help-name="subsplash-live">
<p>Reads live-stream broadcasts.</p>

<h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">operation <span class="property-type">string</span></dt>
        <dd>Overrides the operation selected in the editor. Use the operation id shown below, for example <code>GetAllMediaItems</code>.</dd>
        <dt class="optional">resourceId <span class="property-type">string</span></dt>
        <dd>Resource id for operations whose path contains <code>{id}</code>. Replaces the resource ID typed in the editor. Still sent when the message sets it, even if that operation hides the field.</dd>
        <dt class="optional">body <span class="property-type">object | string</span></dt>
        <dd>Request body. When this is omitted, <code>msg.payload</code> is sent for operations that take a body.</dd>
        <dt class="optional">payload <span class="property-type">object | string</span></dt>
        <dd>Used as the request body only when <code>msg.body</code> is not set and the editor body is empty.</dd>
        <dt class="optional">filters <span class="property-type">object</span></dt>
        <dd>Merged over the editor filters. A key <code>status</code> is sent as <code>filter[status]</code>. Prefix a value with <code>!</code>, <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, or <code>&gt;=</code> for a comparison. Commas mean any of those values. Use <code>*</code> as a wildcard where the field allows it.</dd>
        <dt class="optional">query <span class="property-type">object</span></dt>
        <dd>Extra query parameters, using the API's parameter names. Merged over the editor query. Keys set here win over the same key in filters when the names match exactly.</dd>
        <dt class="optional">include <span class="property-type">string | array</span></dt>
        <dd>Related resources to embed, comma-separated or as an array. Replaces the editor include.</dd>
        <dt class="optional">sort <span class="property-type">string</span></dt>
        <dd>Sort list such as <code>-created_at,title</code>. Prefix a field with <code>-</code> for descending.</dd>
        <dt class="optional">fields <span class="property-type">object</span></dt>
        <dd>Sparse fieldsets. <code>{"responses":"count"}</code> is sent as <code>fields[responses]=count</code>.</dd>
        <dt class="optional">headers <span class="property-type">object</span></dt>
        <dd>Extra request headers. Authorization is set by the config node and is not taken from here.</dd>
        <dt class="optional">pageNumber <span class="property-type">number</span></dt>
        <dd>1-based page. Sent as <code>page[number]</code>.</dd>
        <dt class="optional">pageSize <span class="property-type">number</span></dt>
        <dd>Page size. Sent as <code>page[size]</code>. The platform maximum is usually 100.</dd>
        <dt class="optional">pagination <span class="property-type">string</span></dt>
        <dd><code>page</code> returns one page. <code>all</code> follows <code>_links.next</code> and, when page numbers apply, requests further pages. The config node's max pages caps the walk.</dd>
        <dt class="optional">maxPages <span class="property-type">number</span></dt>
        <dd>Overrides the config node's page cap for this message. Cannot exceed 500.</dd>
        <dt class="optional">collectionTotal <span class="property-type">string</span></dt>
        <dd><code>include</code> or <code>omit</code>. Sent as the <code>Collection-Total</code> header when set.</dd>
        <dt class="optional">collectionStats <span class="property-type">string</span></dt>
        <dd>Sent as the <code>Collection-Stats</code> header when set. Used by donation lists.</dd>
        <dt class="optional">accept <span class="property-type">string</span></dt>
        <dd>Overrides the Accept header. Some donation, payment, and form lists can return <code>text/csv</code>.</dd>
        <dt class="optional">output <span class="property-type">string</span></dt>
        <dd><code>response</code> keeps the API body. <code>items</code> replaces <code>msg.payload</code> with the single embedded array when there is one.</dd>
        <dt class="optional">pathParams <span class="property-type">object</span></dt>
        <dd>Named path parameters. <code>resourceId</code> fills <code>id</code> when that is the only placeholder.</dd>
    </dl>
<h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object | array | string</span></dt>
        <dd>The response body, or the embedded items when output is <code>items</code>. On an API error this is the error body.</dd>
        <dt>statusCode <span class="property-type">number</span></dt>
        <dd>HTTP status of the last response.</dd>
        <dt>headers <span class="property-type">object</span></dt>
        <dd>Response headers. Names are lower case, as Node reports them.</dd>
        <dt>subsplash <span class="property-type">object</span></dt>
        <dd>Call metadata: <code>operation</code>, <code>method</code>, <code>path</code>, <code>url</code>, <code>pagesFetched</code>, <code>count</code>, <code>total</code>, <code>truncated</code>, and <code>collection</code>. Failures also set <code>subsplash.error</code> with <code>message</code>, <code>statusCode</code>, and <code>code</code>.</dd>
    </dl>

<h3>Details</h3>
    <p>Choose an operation in the node, or set <code>msg.operation</code> to one of the ids below. The editor shows Resource ID, Body, Filters, Include, Sort, Fields, paging, Total, and Accept only when the selected operation declares them. Query, Headers, and Output stay available on every operation. A value saved in a hidden field is not sent. A property on the message is still sent, and it replaces the same editor field. Filters, query, and headers are merged, and the message value wins for a key that appears in both.</p>
    <p>List calls can return one page or walk every page. Fetch-all follows the HAL <code>_links.next</code> link when Subsplash sends one. When the operation uses page numbers and there is no next link, further pages are requested until the page is short, <code>total</code> is reached, a page repeats, or the page cap is hit. A merged collection reports <code>count</code> as the number of combined resources. <code>subsplash.truncated</code> is true when the cap stopped the walk early.</p>
    <p>Set <code>output</code> to <code>items</code> when the next node wants the embedded array instead of the collection envelope. Other message properties are left in place.</p>
    <p>API failures call <code>done(err)</code>. Node-RED then reports the error with the message attached, so a Catch node receives <code>msg.statusCode</code>, the error body on <code>msg.payload</code>, and <code>msg.subsplash.error.code</code> (for example <code>resource_not_found</code> or <code>too_many_requests</code>).</p>
    <p>When "Apply default app and org keys" is checked, a documented <code>filter[app_key]</code> or <code>filter[org_key]</code> is filled from the config node if the message did not set it. Filters the operation does not document are not added.</p>
<h4>Operations</h4>

<p><code>GET /live/v1/broadcasts</code>. List Broadcasts. Requires a bearer token. Paginated collection.</p>

<h4>GetOneBroadcast</h4>
<p><code>GET /live/v1/broadcasts/{id}</code>. Get one Broadcast. Requires a bearer token.</p>
<ul><li><code>include</code> — Specify which embedded resources to include with each resource. See [Includes](https://openapi.docs.subsplash.net/#tag/Includes) for details. Possible options are: - `account` -...</li></ul>
<p>Headers:</p><ul><li><code>Cache-Control</code> (no-cache)</li></ul>

<script type="text/html" data-help-name="subsplash-media">
<p>Reads and writes media items and media series.</p>

<h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">operation <span class="property-type">string</span></dt>
        <dd>Overrides the operation selected in the editor. Use the operation id shown below, for example <code>GetAllMediaItems</code>.</dd>
        <dt class="optional">resourceId <span class="property-type">string</span></dt>
        <dd>Resource id for operations whose path contains <code>{id}</code>. Replaces the resource ID typed in the editor. Still sent when the message sets it, even if that operation hides the field.</dd>
        <dt class="optional">body <span class="property-type">object | string</span></dt>
        <dd>Request body. When this is omitted, <code>msg.payload</code> is sent for operations that take a body.</dd>
        <dt class="optional">payload <span class="property-type">object | string</span></dt>
        <dd>Used as the request body only when <code>msg.body</code> is not set and the editor body is empty.</dd>
        <dt class="optional">filters <span class="property-type">object</span></dt>
        <dd>Merged over the editor filters. A key <code>status</code> is sent as <code>filter[status]</code>. Prefix a value with <code>!</code>, <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, or <code>&gt;=</code> for a comparison. Commas mean any of those values. Use <code>*</code> as a wildcard where the field allows it.</dd>
        <dt class="optional">query <span class="property-type">object</span></dt>
        <dd>Extra query parameters, using the API's parameter names. Merged over the editor query. Keys set here win over the same key in filters when the names match exactly.</dd>
        <dt class="optional">include <span class="property-type">string | array</span></dt>
        <dd>Related resources to embed, comma-separated or as an array. Replaces the editor include.</dd>
        <dt class="optional">sort <span class="property-type">string</span></dt>
        <dd>Sort list such as <code>-created_at,title</code>. Prefix a field with <code>-</code> for descending.</dd>
        <dt class="optional">fields <span class="property-type">object</span></dt>
        <dd>Sparse fieldsets. <code>{"responses":"count"}</code> is sent as <code>fields[responses]=count</code>.</dd>
        <dt class="optional">headers <span class="property-type">object</span></dt>
        <dd>Extra request headers. Authorization is set by the config node and is not taken from here.</dd>
        <dt class="optional">pageNumber <span class="property-type">number</span></dt>
        <dd>1-based page. Sent as <code>page[number]</code>.</dd>
        <dt class="optional">pageSize <span class="property-type">number</span></dt>
        <dd>Page size. Sent as <code>page[size]</code>. The platform maximum is usually 100.</dd>
        <dt class="optional">pagination <span class="property-type">string</span></dt>
        <dd><code>page</code> returns one page. <code>all</code> follows <code>_links.next</code> and, when page numbers apply, requests further pages. The config node's max pages caps the walk.</dd>
        <dt class="optional">maxPages <span class="property-type">number</span></dt>
        <dd>Overrides the config node's page cap for this message. Cannot exceed 500.</dd>
        <dt class="optional">collectionTotal <span class="property-type">string</span></dt>
        <dd><code>include</code> or <code>omit</code>. Sent as the <code>Collection-Total</code> header when set.</dd>
        <dt class="optional">collectionStats <span class="property-type">string</span></dt>
        <dd>Sent as the <code>Collection-Stats</code> header when set. Used by donation lists.</dd>
        <dt class="optional">accept <span class="property-type">string</span></dt>
        <dd>Overrides the Accept header. Some donation, payment, and form lists can return <code>text/csv</code>.</dd>
        <dt class="optional">output <span class="property-type">string</span></dt>
        <dd><code>response</code> keeps the API body. <code>items</code> replaces <code>msg.payload</code> with the single embedded array when there is one.</dd>
        <dt class="optional">pathParams <span class="property-type">object</span></dt>
        <dd>Named path parameters. <code>resourceId</code> fills <code>id</code> when that is the only placeholder.</dd>

<h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object | array | string</span></dt>
        <dd>The response body, or the embedded items when output is <code>items</code>. On an API error this is the error body.</dd>
        <dt>statusCode <span class="property-type">number</span></dt>
        <dd>HTTP status of the last response.</dd>
        <dt>headers <span class="property-type">object</span></dt>
        <dd>Response headers. Names are lower case, as Node reports them.</dd>
        <dt>subsplash <span class="property-type">object</span></dt>
        <dd>Call metadata: <code>operation</code>, <code>method</code>, <code>path</code>, <code>url</code>, <code>pagesFetched</code>, <code>count</code>, <code>total</code>, <code>truncated</code>, and <code>collection</code>. Failures also set <code>subsplash.error</code> with <code>message</code>, <code>statusCode</code>, and <code>code</code>.</dd>
    </dl>

<h3>Details</h3>
    <p>Choose an operation in the node, or set <code>msg.operation</code> to one of the ids below. The editor shows Resource ID, Body, Filters, Include, Sort, Fields, paging, Total, and Accept only when the selected operation declares them. Query, Headers, and Output stay available on every operation. A value saved in a hidden field is not sent. A property on the message is still sent, and it replaces the same editor field. Filters, query, and headers are merged, and the message value wins for a key that appears in both.</p>
    <p>List calls can return one page or walk every page. Fetch-all follows the HAL <code>_links.next</code> link when Subsplash sends one. When the operation uses page numbers and there is no next link, further pages are requested until the page is short, <code>total</code> is reached, a page repeats, or the page cap is hit. A merged collection reports <code>count</code> as the number of combined resources. <code>subsplash.truncated</code> is true when the cap stopped the walk early.</p>
    <p>Set <code>output</code> to <code>items</code> when the next node wants the embedded array instead of the collection envelope. Other message properties are left in place.</p>
    <p>API failures call <code>done(err)</code>. Node-RED then reports the error with the message attached, so a Catch node receives <code>msg.statusCode</code>, the error body on <code>msg.payload</code>, and <code>msg.subsplash.error.code</code> (for example <code>resource_not_found</code> or <code>too_many_requests</code>).</p>
    <p>When "Apply default app and org keys" is checked, a documented <code>filter[app_key]</code> or <code>filter[org_key]</code> is filled from the config node if the message did not set it. Filters the operation does not document are not added.</p>

<h4>GetAllMediaItems</h4>
<p><code>GET /media/v1/media-items</code>. List MediaItems. Requires a bearer token. Paginated collection.</p>
<ul><li><code>filter[id]</code> — Filter by id</li><li><code>filter[app_key]</code> — Filter by app_key</li><li><code>filter[title]</code> — Filter by title. Allows wildcards (`*`).</li><li><code>filter[speaker]</code> — Filter by speaker. Allows wildcards (`*`).</li><li><code>filter[position]</code> — Filter by position</li><li><code>filter[short_code]</code> — Filter by short_code</li><li><code>filter[video]</code> — Filter by video</li><li><code>filter[audio]</code> — Filter by audio</li><li><code>filter[web_video_button_url]</code> — Filter by web_video_button_url</li><li><code>filter[media_series]</code> — Filter by media_series</li><li><code>filter[auto_publish]</code> — Filter by auto_publish</li><li><code>filter[status]</code> (draft, scheduled, published)</li><li><code>filter[published_at]</code> — Filter by published_at</li><li><code>filter[published_at.min]</code> — Filter by a minimum published_at date</li><li><code>filter[published_at.max]</code> — Filter by a maximum published_at date</li><li><code>filter[created_at]</code> — Filter by created_at</li><li><code>filter[created_at.min]</code> — Filter by a minimum created_at date</li><li><code>filter[created_at.max]</code> — Filter by a maximum created_at date</li><li><code>filter[updated_at]</code> — Filter by updated_at</li><li><code>filter[updated_at.min]</code> — Filter by a minimum updated_at date</li><li><code>filter[updated_at.max]</code> — Filter by a maximum updated_at date</li><li><code>filter[media_series.legacy_series_list_id]</code> — Filter by media_series.legacy_series_list_id</li><li><code>filter[legacy_id]</code> — Filter by legacy_id</li><li><code>filter[external_id]</code> — Filter by third-party unique identifier.</li><li><code>filter[unlisted]</code> — Include or exclude unlisted resources in results</li><li><code>sort</code> — fields to sort on</li><li><code>include</code> — Support for including _embedded resources.</li><li><code>filter[broadcast.id]</code> — Filter by the attached broadcast resource.</li><li><code>filter[broadcast.status]</code> (scheduled, live, ended, on-demand, never-happened)</li><li><code>filter[broadcast.start_at]</code> — Filter by the broadcast&#x27;s start_at field. Implies to query only live media items. Supports range filter operators.</li><li><code>filter[broadcast.end_at]</code> — Filter by the broadcast&#x27;s end_at field. Implies to query only live media items. Supports range filter operators.</li><li><code>filter[upcoming_live]</code> — Filter to get the media item associated with the current or next broadcast.</li><li><code>filter[live-template.id]</code> — Filter by the attached live-template resource.</li></ul>
<h4>CreateMediaItem</h4>
<p><code>POST /media/v1/media-items</code>. Create a MediaItem. Requires a bearer token. Optional body (<code>application/json</code>).</p>
<p>Adds a new MediaItem</p>
<p>Body fields include <code>additional_label</code>, <code>app_key</code>, <code>auto_publish</code>, <code>created_at</code>, <code>date</code>, <code>deleted_at</code>, <code>external_audio_url</code>, <code>external_id</code>, <code>external_m3u8_url</code>, <code>external_video_url</code>, <code>id</code>, <code>legacy_id</code>.</p>

<h4>UpdateMediaItem</h4>

<p>Body fields include <code>additional_label</code>, <code>app_key</code>, <code>auto_publish</code>, <code>created_at</code>, <code>date</code>, <code>deleted_at</code>, <code>external_audio_url</code>, <code>external_id</code>, <code>external_m3u8_url</code>, <code>external_video_url</code>, <code>id</code>, <code>legacy_id</code>.</p>

<h4>DeleteMediaItem</h4>
<p><code>DELETE /media/v1/media-items/{id}</code>. Delete a MediaItem. Requires a bearer token.</p>
