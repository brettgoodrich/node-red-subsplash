<script type="text/html" data-help-name="subsplash-people">
<p>Reads and writes profiles, households, custom fields, and membership status changes.</p>

<h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">operation <span class="property-type">string</span></dt>
        <dd>Overrides the operation selected in the editor. Use the operation id shown below, for example <code>GetAllMediaItems</code>.</dd>
        <dt class="optional">resourceId <span class="property-type">string</span></dt>
        <dd>Resource id for operations whose path contains <code>{id}</code>. Replaces the resource ID typed in the editor. Still sent when the message sets it, even if that operation hides the field.</dd>
        <dt class="optional">body <span class="property-type">object | string</span></dt>
        <dd>Request body. When this is omitted, <code>msg.payload</code> is sent for operations that take a body.</dd>
        <dt class="optional">payload <span class="property-type">object | string</span></dt>
        <dd>Used as the request body only when <code>msg.body</code> is not set and the editor body is empty.</dd>
        <dt class="optional">filters <span class="property-type">object</span></dt>
        <dd>Merged over the editor filters. A key <code>status</code> is sent as <code>filter[status]</code>. Prefix a value with <code>!</code>, <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, or <code>&gt;=</code> for a comparison. Commas mean any of those values. Use <code>*</code> as a wildcard where the field allows it.</dd>
        <dt class="optional">query <span class="property-type">object</span></dt>
        <dd>Extra query parameters, using the API's parameter names. Merged over the editor query. Keys set here win over the same key in filters when the names match exactly.</dd>
        <dt class="optional">include <span class="property-type">string | array</span></dt>
        <dd>Related resources to embed, comma-separated or as an array. Replaces the editor include.</dd>
        <dt class="optional">sort <span class="property-type">string</span></dt>
        <dd>Sort list such as <code>-created_at,title</code>. Prefix a field with <code>-</code> for descending.</dd>
        <dt class="optional">fields <span class="property-type">object</span></dt>
        <dd>Sparse fieldsets. <code>{"responses":"count"}</code> is sent as <code>fields[responses]=count</code>.</dd>
        <dt class="optional">headers <span class="property-type">object</span></dt>
        <dd>Extra request headers. Authorization is set by the config node and is not taken from here.</dd>
        <dt class="optional">pageNumber <span class="property-type">number</span></dt>
        <dd>1-based page. Sent as <code>page[number]</code>.</dd>
        <dt class="optional">pageSize <span class="property-type">number</span></dt>
        <dd>Page size. Sent as <code>page[size]</code>. The platform maximum is usually 100.</dd>
        <dt class="optional">pagination <span class="property-type">string</span></dt>
        <dd><code>page</code> returns one page. <code>all</code> follows <code>_links.next</code> and, when page numbers apply, requests further pages. The config node's max pages caps the walk.</dd>
        <dt class="optional">maxPages <span class="property-type">number</span></dt>
        <dd>Overrides the config node's page cap for this message. Cannot exceed 500.</dd>
        <dt class="optional">collectionTotal <span class="property-type">string</span></dt>
        <dd><code>include</code> or <code>omit</code>. Sent as the <code>Collection-Total</code> header when set.</dd>
        <dt class="optional">collectionStats <span class="property-type">string</span></dt>
        <dd>Sent as the <code>Collection-Stats</code> header when set. Used by donation lists.</dd>
        <dt class="optional">accept <span class="property-type">string</span></dt>
        <dd>Overrides the Accept header. Some donation, payment, and form lists can return <code>text/csv</code>.</dd>
        <dt class="optional">output <span class="property-type">string</span></dt>
        <dd><code>response</code> keeps the API body. <code>items</code> replaces <code>msg.payload</code> with the single embedded array when there is one.</dd>
        <dt class="optional">pathParams <span class="property-type">object</span></dt>
        <dd>Named path parameters. <code>resourceId</code> fills <code>id</code> when that is the only placeholder.</dd>
    </dl>
<h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object | array | string</span></dt>
        <dd>The response body, or the embedded items when output is <code>items</code>. On an API error this is the error body.</dd>
        <dt>statusCode <span class="property-type">number</span></dt>
        <dd>HTTP status of the last response.</dd>
        <dt>headers <span class="property-type">object</span></dt>
        <dd>Response headers. Names are lower case, as Node reports them.</dd>
        <dt>subsplash <span class="property-type">object</span></dt>
        <dd>Call metadata: <code>operation</code>, <code>method</code>, <code>path</code>, <code>url</code>, <code>pagesFetched</code>, <code>count</code>, <code>total</code>, <code>truncated</code>, and <code>collection</code>. Failures also set <code>subsplash.error</code> with <code>message</code>, <code>statusCode</code>, and <code>code</code>.</dd>
    </dl>

<h3>Details</h3>
    <p>Choose an operation in the node, or set <code>msg.operation</code> to one of the ids below. The editor shows Resource ID, Body, Filters, Include, Sort, Fields, paging, Total, and Accept only when the selected operation declares them. Query, Headers, and Output stay available on every operation. A value saved in a hidden field is not sent. A property on the message is still sent, and it replaces the same editor field. Filters, query, and headers are merged, and the message value wins for a key that appears in both.</p>
    <p>List calls can return one page or walk every page. Fetch-all follows the HAL <code>_links.next</code> link when Subsplash sends one. When the operation uses page numbers and there is no next link, further pages are requested until the page is short, <code>total</code> is reached, a page repeats, or the page cap is hit. A merged collection reports <code>count</code> as the number of combined resources. <code>subsplash.truncated</code> is true when the cap stopped the walk early.</p>
    <p>Set <code>output</code> to <code>items</code> when the next node wants the embedded array instead of the collection envelope. Other message properties are left in place.</p>
    <p>API failures call <code>done(err)</code>. Node-RED then reports the error with the message attached, so a Catch node receives <code>msg.statusCode</code>, the error body on <code>msg.payload</code>, and <code>msg.subsplash.error.code</code> (for example <code>resource_not_found</code> or <code>too_many_requests</code>).</p>
    <p>When "Apply default app and org keys" is checked, a documented <code>filter[app_key]</code> or <code>filter[org_key]</code> is filled from the config node if the message did not set it. Filters the operation does not document are not added.</p>
<h4>Operations</h4>
<h4>ListCustomFieldDefinitions</h4>
<p><code>GET /people/v1/custom-field-definitions</code>. List Custom Field Definitions. Requires a bearer token. Paginated collection.</p>
<ul><li><code>filter[org_key]</code> — Filter by resource org_key</li><li><code>filter[status]</code> (active, archived)</li><li><code>sort</code> — fields to sort on</li></ul>
<h4>CreateCustomFieldDefinition</h4>
<p><code>POST /people/v1/custom-field-definitions</code>. Create a Custom Field Definition. Requires a bearer token. Optional body (<code>application/json</code>).</p>
<p>Required body fields: <code>name</code>, <code>org_key</code>, <code>type</code>.</p>
<h4>GetOneCustomFieldDefinition</h4>
<p><code>GET /people/v1/custom-field-definitions/{id}</code>. Get a Custom Field Definition. Requires a bearer token.</p>
<h4>UpdateCustomFieldDefinition</h4>
<p><code>PATCH /people/v1/custom-field-definitions/{id}</code>. Update a Custom Field Definition. Requires a bearer token. Optional body (<code>application/json</code>).</p>
<p>Body fields include <code>choices</code>, <code>name</code>, <code>status</code>, <code>type</code>.</p>
<h4>ListHouseholds</h4>
<p><code>GET /people/v1/households</code>. List Households. Requires a bearer token. Paginated collection.</p>
<ul><li><code>filter[id]</code> — Filter by resource id</li><li><code>filter[org_key]</code> — Filter by resource org_key</li><li><code>filter[status]</code> (*, active, archived, merged, gdpr)</li><li><code>filter[external_id]</code> — Filter by an external_id of a Household.</li><li><code>filter[created_at]</code> — Filter by the resource&#x27;s created_at value.</li></ul>
<h4>CreateHousehold</h4>
<p><code>POST /people/v1/households</code>. Create a household. Requires a bearer token. Required body (<code>application/json</code>).</p>
<p>Required body fields: <code>name</code>, <code>org_key</code>.</p>
<h4>GetOneHousehold</h4>
<p><code>GET /people/v1/households/{id}</code>. Get one Household. Requires a bearer token.</p>
<h4>UpdateHousehold</h4>
<p><code>PATCH /people/v1/households/{id}</code>. Update a Household. Requires a bearer token. Required body (<code>application/json</code>).</p>
<p>This endpoint supports 1. &lt;b&gt;Modifying&lt;/b&gt; the metadata of a household resource 2. &lt;b&gt;Adding&lt;/b&gt; members to a household. In order to add a member to a household, the member should not be in another household. 3. &lt;b&gt;Removing&lt;/b&gt; members from a household 4. &lt;b&gt;Updating&lt;/b&gt; the household role of members &lt;h3&gt;Adding, rem...</p>
<p>Body fields include <code>family_id</code>, <code>fluro_data</code>, <code>name</code>, <code>primary_email</code>, <code>primary_phone</code>, <code>status</code>.</p>
<h4>DeleteHousehold</h4>
<p><code>DELETE /people/v1/households/{id}</code>. Delete a Household. Requires a bearer token.</p>
<p>This endpoint deletes a household resource and removes all of it&#x27;s members, trusted people and guests from the household. Notes: * The operation is idempotent. Deleting a household that is already deleted returns `204` and repeats the removal, so a client is free to retry. * A specific member can be removed by [PATC...</p>
<h4>ListMembershipStatusChanges</h4>
<p><code>GET /people/v1/membership-status-changes</code>. List Membership Status Changes. Requires a bearer token. Paginated collection.</p>
<p>Endpoint used to list MembershipStatusChanges</p>
<ul><li><code>filter[id]</code> — Filter by resource id</li><li><code>filter[profile.id]</code> — Filter by profile id.</li><li><code>filter[effective_on]</code> — Filter by the date the membership status change took place.</li><li><code>sort</code> — resource fields to sort on</li></ul>
<p>Headers:</p><ul><li><code>Collection-Total</code> (include, omit)</li></ul>
<h4>CreateMembershipStatusChange</h4>
<p><code>POST /people/v1/membership-status-changes</code>. Create a Membership Status Change. Requires a bearer token. Required body (<code>application/json</code>).</p>
<p>This endpoint is used to create a MembershipStatusChange. Note: Only 1 MembershipStatusChange can be assigned to a profile at a time for the time being.</p>
<p>Required body fields: <code>effective_on</code>, <code>org_key</code>.</p>
<h4>GetOneMembershipStatusChange</h4>
<p><code>GET /people/v1/membership-status-changes/{id}</code>. Get one Membership Status Change. Requires a bearer token.</p>
<h4>UpdateMembershipStatusChange</h4>
<p><code>PATCH /people/v1/membership-status-changes/{id}</code>. Update a MembershipStatusChange. Requires a bearer token. Required body (<code>application/json</code>).</p>
<p>Endpoint used to update a MembershipStatusChange</p>
<p>Body fields include <code>effective_on</code>, <code>status</code>.</p>
<h4>DeleteMembershipStatusChange</h4>
<p><code>DELETE /people/v1/membership-status-changes/{id}</code>. Delete a MembershipStatusChange. Requires a bearer token.</p>
<p>This endpoint deletes a MembershipStatusChange resource.</p>
<h4>ListProfiles</h4>
<p><code>GET /people/v1/profiles</code>. List Profiles. Requires a bearer token. Paginated collection.</p>
<ul><li><code>sort</code> — A comma-separated list of fields with directions. There are two directions for sorting: ascending and descending. To specify a direction, prepend the field name with `+` for asc...</li><li><code>filter[id]</code> — Filter by resource id</li><li><code>filter[email]</code> — Filter by primary email address. Wildcards not supported.</li><li><code>filter[emails]</code> — Filter by secondary email addresses. Wildcards not supported.</li><li><code>filter[first_name]</code> — Filter by the first name field. Wildcards not supported.</li><li><code>filter[last_name]</code> — Filter by the last name field. Wildcards not supported.</li><li><code>filter[dob_day]</code> — Filter profile by date-of-birth day.</li><li><code>filter[dob_month]</code> — Filter profile by date-of-birth month.</li><li><code>filter[date_of_birth]</code> — Filter profile date-of-birth.</li><li><code>filter[graduation_year]</code> — Filter profile by graduation year. This is currently only intended to be used to fetch profiles with existing academic grades (i.e. `filter[graduation_year]=!null`).</li><li><code>filter[gender]</code> — Filter profile gender.</li><li><code>filter[external_id]</code> — Filter by an external_id of a Profile.</li><li><code>filter[org_key]</code> — Filter by resource org_key</li><li><code>filter[short_id]</code> — Filter by the primary_key of a resource.</li><li><code>filter[address.id]</code> — Filter by the ID of an address.</li><li><code>filter[phone]</code> — Filter by phone number. Wildcards not supported.</li><li><code>filter[phones]</code> — Filter by alternate phone numbers. Wildcards not supported.</li><li><code>filter[created_at]</code> — Filter by the resource&#x27;s created_at value.</li><li><code>filter[updated_at]</code> — Filter by the resource&#x27;s updated_at value.</li><li><code>filter[status]</code> (*, active, archived, merged, gdpr)</li></ul>
<h4>CreateProfile</h4>
<p><code>POST /people/v1/profiles</code>. Create a Profile. Requires a bearer token. Optional body (<code>application/json</code>).</p>
<p>Adds a new Profile. Note that duplicate profiles per EndUser and Org are not allowed. A Profile can contain one contact email and at most 10 supplementary emails. Supplementary values are trimmed without changing their request positions. Empty values fail validation. Invalid and duplicate email errors include `/emai...</p>
<p>Required body fields: <code>first_name</code>, <code>last_name</code>, <code>org_key</code>.</p>
<h4>GetOneProfile</h4>
<p><code>GET /people/v1/profiles/{id}</code>. Get one Profile. Requires a bearer token.</p>
<ul><li><code>include</code> — Specify which embedded resources to include with each resource. See [Includes](https://api-docs.subsplash.net/#tag/Includes) for details. Possible options are: - `end-user` - `a...</li></ul>
<h4>UpdateProfile</h4>
<p><code>PATCH /people/v1/profiles/{id}</code>. Update a Profile. Requires a bearer token. Optional body (<code>application/json</code>).</p>
<p>Updates a profile resource. An update cannot increase the supplementary email count above 10. A Profile that already has more than 10 supplementary emails can keep or reduce that count. Supplementary values are trimmed without changing their request positions. Empty values fail validation. Invalid and duplicate emai...</p>
<p>Required body fields: <code>first_name</code>, <code>last_name</code>, <code>org_key</code>.</p>

<script type="text/html" data-help-name="subsplash-push">
<p>Reads and writes push topics and notifications, and lists or bulk-creates topic subscriptions.</p>

<h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">operation <span class="property-type">string</span></dt>
        <dd>Overrides the operation selected in the editor. Use the operation id shown below, for example <code>GetAllMediaItems</code>.</dd>
        <dt class="optional">resourceId <span class="property-type">string</span></dt>
        <dd>Resource id for operations whose path contains <code>{id}</code>. Replaces the resource ID typed in the editor. Still sent when the message sets it, even if that operation hides the field.</dd>
        <dt class="optional">body <span class="property-type">object | string</span></dt>
        <dd>Request body. When this is omitted, <code>msg.payload</code> is sent for operations that take a body.</dd>
        <dt class="optional">payload <span class="property-type">object | string</span></dt>
        <dd>Used as the request body only when <code>msg.body</code> is not set and the editor body is empty.</dd>
        <dt class="optional">filters <span class="property-type">object</span></dt>
        <dd>Merged over the editor filters. A key <code>status</code> is sent as <code>filter[status]</code>. Prefix a value with <code>!</code>, <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, or <code>&gt;=</code> for a comparison. Commas mean any of those values. Use <code>*</code> as a wildcard where the field allows it.</dd>
        <dt class="optional">query <span class="property-type">object</span></dt>
        <dd>Extra query parameters, using the API's parameter names. Merged over the editor query. Keys set here win over the same key in filters when the names match exactly.</dd>
        <dt class="optional">include <span class="property-type">string | array</span></dt>
        <dd>Related resources to embed, comma-separated or as an array. Replaces the editor include.</dd>
        <dt class="optional">sort <span class="property-type">string</span></dt>
        <dd>Sort list such as <code>-created_at,title</code>. Prefix a field with <code>-</code> for descending.</dd>
        <dt class="optional">fields <span class="property-type">object</span></dt>
        <dd>Sparse fieldsets. <code>{"responses":"count"}</code> is sent as <code>fields[responses]=count</code>.</dd>
        <dt class="optional">headers <span class="property-type">object</span></dt>
        <dd>Extra request headers. Authorization is set by the config node and is not taken from here.</dd>
        <dt class="optional">pageNumber <span class="property-type">number</span></dt>
        <dd>1-based page. Sent as <code>page[number]</code>.</dd>
        <dt class="optional">pageSize <span class="property-type">number</span></dt>
        <dd>Page size. Sent as <code>page[size]</code>. The platform maximum is usually 100.</dd>
        <dt class="optional">pagination <span class="property-type">string</span></dt>
        <dd><code>page</code> returns one page. <code>all</code> follows <code>_links.next</code> and, when page numbers apply, requests further pages. The config node's max pages caps the walk.</dd>
        <dt class="optional">maxPages <span class="property-type">number</span></dt>
        <dd>Overrides the config node's page cap for this message. Cannot exceed 500.</dd>
        <dt class="optional">collectionTotal <span class="property-type">string</span></dt>
        <dd><code>include</code> or <code>omit</code>. Sent as the <code>Collection-Total</code> header when set.</dd>
        <dt class="optional">collectionStats <span class="property-type">string</span></dt>
        <dd>Sent as the <code>Collection-Stats</code> header when set. Used by donation lists.</dd>
        <dt class="optional">accept <span class="property-type">string</span></dt>
        <dd>Overrides the Accept header. Some donation, payment, and form lists can return <code>text/csv</code>.</dd>
        <dt class="optional">output <span class="property-type">string</span></dt>
        <dd><code>response</code> keeps the API body. <code>items</code> replaces <code>msg.payload</code> with the single embedded array when there is one.</dd>
        <dt class="optional">pathParams <span class="property-type">object</span></dt>
        <dd>Named path parameters. <code>resourceId</code> fills <code>id</code> when that is the only placeholder.</dd>
    </dl>
<h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object | array | string</span></dt>
        <dd>The response body, or the embedded items when output is <code>items</code>. On an API error this is the error body.</dd>
        <dt>statusCode <span class="property-type">number</span></dt>
        <dd>HTTP status of the last response.</dd>
        <dt>headers <span class="property-type">object</span></dt>
        <dd>Response headers. Names are lower case, as Node reports them.</dd>
        <dt>subsplash <span class="property-type">object</span></dt>
        <dd>Call metadata: <code>operation</code>, <code>method</code>, <code>path</code>, <code>url</code>, <code>pagesFetched</code>, <code>count</code>, <code>total</code>, <code>truncated</code>, and <code>collection</code>. Failures also set <code>subsplash.error</code> with <code>message</code>, <code>statusCode</code>, and <code>code</code>.</dd>
    </dl>

<h3>Details</h3>
    <p>Choose an operation in the node, or set <code>msg.operation</code> to one of the ids below. The editor shows Resource ID, Body, Filters, Include, Sort, Fields, paging, Total, and Accept only when the selected operation declares them. Query, Headers, and Output stay available on every operation. A value saved in a hidden field is not sent. A property on the message is still sent, and it replaces the same editor field. Filters, query, and headers are merged, and the message value wins for a key that appears in both.</p>
    <p>List calls can return one page or walk every page. Fetch-all follows the HAL <code>_links.next</code> link when Subsplash sends one. When the operation uses page numbers and there is no next link, further pages are requested until the page is short, <code>total</code> is reached, a page repeats, or the page cap is hit. A merged collection reports <code>count</code> as the number of combined resources. <code>subsplash.truncated</code> is true when the cap stopped the walk early.</p>
    <p>Set <code>output</code> to <code>items</code> when the next node wants the embedded array instead of the collection envelope. Other message properties are left in place.</p>
    <p>API failures call <code>done(err)</code>. Node-RED then reports the error with the message attached, so a Catch node receives <code>msg.statusCode</code>, the error body on <code>msg.payload</code>, and <code>msg.subsplash.error.code</code> (for example <code>resource_not_found</code> or <code>too_many_requests</code>).</p>
    <p>When "Apply default app and org keys" is checked, a documented <code>filter[app_key]</code> or <code>filter[org_key]</code> is filled from the config node if the message did not set it. Filters the operation does not document are not added.</p>
<h4>Operations</h4>
<h4>CreateBulkTopicSubscription</h4>
<p><code>POST /bulk-topic-subscriptions</code>. Create Bulk Topic Subscription. Requires a bearer token. Optional body (<code>application/hal+json</code>).</p>
<p>Creates the Topic Subscription (in the request body) by External User. An External User can resolve to multiple platform endpoints.</p>
<p>Body fields include <code>app_key</code>, <code>aws_sns_subscription_arn</code>, <code>created_at</code>, <code>deleted_at</code>, <code>id</code>, <code>updated_at</code>.</p>
<h4>GetAllNotifications</h4>
<p><code>GET /notifications</code>. List Notifications. Requires a bearer token. Paginated collection.</p>
<p>Lists all Notifications based on requested filters</p>
<h4>CreateNotification</h4>
<p><code>POST /notifications</code>. Create a Notification. Requires a bearer token. Optional body (<code>application/hal+json</code>).</p>
<p>Creates the Notification sent in the request body</p>
<p>Body fields include <code>additional_description</code>, <code>app_key</code>, <code>body</code>, <code>communication_id</code>, <code>created_at</code>, <code>deleted_at</code>, <code>displayed_count</code>, <code>id</code>, <code>is_live_stream_integrated</code>, <code>minutes_before_published</code>, <code>opened_count</code>, <code>pending_at</code>.</p>
<h4>GetOneNotification</h4>
<p><code>GET /notifications/{id}</code>. Get one Notification. Requires a bearer token.</p>
<p>Gets one Notification identified by the ID in the request</p>
<h4>UpdateNotification</h4>
<p><code>PATCH /notifications/{id}</code>. Update a Notification. Requires a bearer token. Optional body (<code>application/hal+json</code>).</p>
<p>Updates the Notification identified by the ID in the request, using the details in the request body</p>
<p>Body fields include <code>additional_description</code>, <code>app_key</code>, <code>body</code>, <code>communication_id</code>, <code>created_at</code>, <code>deleted_at</code>, <code>displayed_count</code>, <code>id</code>, <code>is_live_stream_integrated</code>, <code>minutes_before_published</code>, <code>opened_count</code>, <code>pending_at</code>.</p>
<h4>DeleteNotification</h4>
<p><code>DELETE /notifications/{id}</code>. Delete a Notification. Requires a bearer token.</p>
<p>Deletes the Notification identified by the ID in the request</p>
<h4>GetAllTopicSubscriptions</h4>
<p><code>GET /topic-subscriptions</code>. List Topic Subscriptions. Requires a bearer token. Paginated collection.</p>
<p>Lists all Topic Subscriptions based on requested filters</p>
<ul><li><code>filter[app_key]</code> — Filter by app_key</li><li><code>filter[id]</code> — Filter by id</li><li><code>filter[topic]</code> — Filter by topic (id of topic)</li><li><code>filter[platform_endpoint]</code> — Filter by platform endpoint (id of platform endpoint)</li><li><code>filter[deleted_at]</code> — Filter by deleted time</li><li><code>sort</code> — Fields by which you can sort. There are two directions for sorting: ascending and descending. To specify a direction, prepend the field name with + for ascending or - for descen...</li></ul>
<h4>GetOneTopicSubscription</h4>
<p><code>GET /topic-subscriptions/{id}</code>. Get one Topic Subscription. Requires a bearer token.</p>
<p>Gets one Topic Subscription identified by the ID in the request</p>
<h4>GetAllTopics</h4>
<p><code>GET /topics</code>. List Topics. Requires a bearer token. Paginated collection.</p>
<p>Lists all Topics based on requested filters</p>
<ul><li><code>filter[app_key]</code> — Filter by app_key</li><li><code>filter[id]</code> — Filter by id</li><li><code>filter[is_general]</code> — Filter by is general</li><li><code>filter[is_private]</code> — Filter by is private. Note this must be set to true to see private topics. If this filter is not set, the default behavior is to not show private topics.</li><li><code>filter[deactivated_at]</code> — Filter by deactivation time</li><li><code>sort</code> — Fields by which you can sort. There are two directions for sorting: ascending and descending. To specify a direction, prepend the field name with + for ascending or - for descen...</li></ul>
<h4>CreateTopic</h4>
<p><code>POST /topics</code>. Create a Topic. Requires a bearer token. Optional body (<code>application/hal+json</code>).</p>
<p>Creates the Topic sent in the request body</p>
<p>Body fields include <code>app_key</code>, <code>aws_sns_topic_arn</code>, <code>created_at</code>, <code>deactivated_at</code>, <code>deleted_at</code>, <code>id</code>, <code>is_general</code>, <code>is_private</code>, <code>num_subscribers</code>, <code>title</code>, <code>updated_at</code>.</p>
<h4>GetOneTopic</h4>
<p><code>GET /topics/{id}</code>. Get one Topic. Requires a bearer token.</p>
<p>Gets one Topic identified by the ID in the request</p>
<h4>UpdateTopic</h4>
<p><code>PATCH /topics/{id}</code>. Update a Topic. Requires a bearer token. Optional body (<code>application/hal+json</code>).</p>
<p>Updates the Topic identified by the ID in the request, using the details in the request body</p>
<p>Body fields include <code>app_key</code>, <code>aws_sns_topic_arn</code>, <code>created_at</code>, <code>deactivated_at</code>, <code>deleted_at</code>, <code>id</code>, <code>is_general</code>, <code>is_private</code>, <code>num_subscribers</code>, <code>title</code>, <code>updated_at</code>.</p>
<h4>DeleteTopics</h4>
<p><code>DELETE /topics/{id}</code>. Delete a Topic. Requires a bearer token.</p>
<p>Deletes the Topic identified by the ID in the request</p>
<h3>References</h3>
    <ul>
        <li><a href="https://developer.subsplash.com/api/openapi.yaml">Subsplash OpenAPI specification</a> — source for these operations</li>
        <li><a href="https://developer.subsplash.com/">Subsplash developer site</a> — documentation access is separate from API credentials</li>
    </ul>

    <div class="form-row">

    <div class="form-row">

    <div class="form-row">

<script type="text/html" data-help-name="subsplash-request">
    <p>Calls any path on the configured Subsplash base URL, including endpoints that are not wrapped by a resource node.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">method <span class="property-type">string</span></dt>
        <dd>HTTP method. One of GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS.</dd>
        <dt class="optional">path <span class="property-type">string</span></dt>
        <dd>Path beginning with <code>/</code>, or a full URL whose origin matches the config base URL. <code>{id}</code> is replaced from <code>msg.resourceId</code>.</dd>
        <dt class="optional">url <span class="property-type">string</span></dt>
        <dd>Used as the path when <code>msg.path</code> and the editor path are empty. Same origin rules apply.</dd>
        <dt class="optional">authenticate <span class="property-type">boolean</span></dt>
        <dd>When false, the bearer token is omitted. Public signing keys are the usual reason.</dd>
        <dt class="optional">contentType <span class="property-type">string</span></dt>
        <dd>Content-Type for the body. Defaults to <code>application/json</code> when a body is present. Use <code>application/x-www-form-urlencoded</code> to send an object as a form.</dd>
        <dt class="optional">body <span class="property-type">object | string</span></dt>
        <dd>Request body. For GET, HEAD, DELETE, and OPTIONS the editor body is used only when set; otherwise <code>msg.payload</code> is not sent unless <code>msg.body</code> is set.</dd>
        <dt class="optional">payload <span class="property-type">object | string</span></dt>
        <dd>Body for POST, PUT, and PATCH when <code>msg.body</code> and the editor body are empty.</dd>
        <dt class="optional">query <span class="property-type">object</span></dt>
        <dd>Query parameters merged over the editor query.</dd>
        <dt class="optional">filters <span class="property-type">object</span></dt>
        <dd>Same filter object the resource nodes accept.</dd>
        <dt class="optional">include <span class="property-type">string | array</span></dt>
        <dd>Include list.</dd>
        <dt class="optional">sort <span class="property-type">string</span></dt>
        <dd>Sort list.</dd>
        <dt class="optional">fields <span class="property-type">object</span></dt>
        <dd>Sparse fieldsets.</dd>
        <dt class="optional">headers <span class="property-type">object</span></dt>
        <dd>Extra headers. A bearer token replaces any Authorization header when authenticate is true, and strips it when authenticate is false.</dd>
        <dt class="optional">pagination <span class="property-type">string</span></dt>
        <dd><code>all</code> walks pages the same way a resource list does. <code>page</code> sends one request.</dd>
        <dt class="optional">pageNumber <span class="property-type">number</span></dt>
        <dd>Sent as <code>page[number]</code>.</dd>
        <dt class="optional">pageSize <span class="property-type">number</span></dt>
        <dd>Sent as <code>page[size]</code>.</dd>
        <dt class="optional">maxPages <span class="property-type">number</span></dt>
        <dd>Page cap for this message.</dd>
        <dt class="optional">output <span class="property-type">string</span></dt>
        <dd><code>response</code> or <code>items</code>.</dd>
        <dt class="optional">resourceId <span class="property-type">string</span></dt>
        <dd>Fills <code>{id}</code> in the path.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object | array | string</span></dt>
        <dd>Response body, or the error body when the call fails.</dd>
        <dt>statusCode <span class="property-type">number</span></dt>
        <dd>HTTP status of the last response.</dd>
        <dt>headers <span class="property-type">object</span></dt>
        <dd>Response headers.</dd>
        <dt>subsplash <span class="property-type">object</span></dt>
        <dd>Method, path, paging metadata, and <code>error</code> when the call failed.</dd>
    </dl>
    <h3>Details</h3>
    <p>Use this node for a path the resource nodes do not list, or when you already have a URL from a HAL <code>_links</code> object. Requests that point at a different host are rejected. Redirects are not followed.</p>
    <p>The same token cache, 401 refresh, and 429 backoff as the resource nodes apply. POST, PUT, and PATCH are retried only when Subsplash returns 429.</p>
    <h3>References</h3>
    <ul>
        <li><a href="https://developer.subsplash.com/api/openapi.yaml">Subsplash OpenAPI specification</a></li>
    </ul>
</script>
